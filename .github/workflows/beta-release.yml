name: Beta release

# Beta-публикация из ветки `next` в npm с dist-tag `beta`.
# Схема: `changeset version` выполняет разработчик локально в `next` и коммитит;
# workflow только проверяет, собирает и публикует (без git-записей, без push в main).
on:
  push:
    branches: [next]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Только проверки и tarball, без публикации
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  beta-release:
    name: Beta release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check NPM_TOKEN
        if: ${{ inputs.dry_run != true }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "Secret NPM_TOKEN не задан (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - run: npm ci

      - name: Lint
        run: |
          npm run lint
          npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --project=unit

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Visual tests
        run: npm run test:visual

      - name: Build library
        run: npm run build

      - name: Guard — prerelease mode enabled
        run: |
          if [ ! -f .changeset/pre.json ]; then
            echo "::error::Ветка не в prerelease-режиме (.changeset/pre.json отсутствует)."
            echo "Локально: npx changeset pre enter beta && git add .changeset/pre.json && git commit -m 'chore: enter beta mode'"
            exit 1
          fi
          tag=$(node -p "require('./.changeset/pre.json').tag")
          if [ "$tag" != "beta" ]; then
            echo "::error::Ожидался prerelease-тег 'beta', а в pre.json — '$tag'."
            exit 1
          fi
          echo "Prerelease-режим: tag=$tag"

      - name: Guard — version is a beta prerelease
        run: |
          version=$(node -p "require('./package.json').version")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [[ ! "$version" =~ -beta(\.|$) ]]; then
            echo "::error::Версия '$version' не является beta-prerelease. Выполните локально: npx changeset version && git commit -am 'chore(release): $version'"
            exit 1
          fi
          echo "Версия: $version"

      - name: Guard — no pending changesets
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          if [ "$pending" != "0" ]; then
            echo "::error::Есть необработанные changesets ($pending шт.). Перед публикацией выполните локально в next: npx changeset version && git commit -am 'chore(release)' && git push"
            ls .changeset/*.md 2>/dev/null || true
            exit 1
          fi
          echo "Незакоммиченных changesets нет — версия готова к публикации"

      - name: Pack tarball (artifact)
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Publish to npm (dist-tag beta)
        if: ${{ inputs.dry_run != true }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # В pre-режиме changesets сам публикует с тегом из pre.json ('beta') и
        # запрещает явный --tag. --no-git-tag: без git-операций (permissions: contents: read).
        # Идемпотентно: уже опубликованные версии пропускаются, latest не затрагивается.
        run: npx changeset publish --no-git-tag

      - name: Release report
        if: ${{ always() }}
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "# Beta release report"
            echo ""
            echo "- Ветка: \`${REF}\`"
            echo "- Commit: \`${SHA}\`"
            echo "- Событие: \`${EVENT}\`"
            echo "- Версия: \`${VERSION:-n/a}\`"
            echo "- npm-тег: \`beta\`"
            echo "- Результат: ${JOB_STATUS}"
          } > "$RUNNER_TEMP/release-report.md"
          cat "$RUNNER_TEMP/release-report.md"

      - name: Upload release artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: beta-release-${{ env.VERSION || 'unknown' }}
          path: |
            ${{ runner.temp }}/*.tgz
            ${{ runner.temp }}/release-report.md
          retention-days: 30
          if-no-files-found: ignore
